agent {
    data_dir = "/var/lib/spire/agent"
    log_level = "INFO"
    server_address = "${SPIRE_SERVER_ADDRESS}"
    server_port = "8081"
    socket_path = "/run/spire/agent/public/api.sock"
    trust_bundle_path = "/etc/spire/agent/bootstrap.pem"
    trust_domain = "zt.demo"
}

plugins {
    NodeAttestor "aws_iid" {
        plugin_data {}
    }
    KeyManager "disk" {
        plugin_data {
            directory = "/var/lib/spire/agent"
        }
    }
    WorkloadAttestor "unix" {
        plugin_data {
            discover_workload_path = true
            workload_size_limit = 104857600
        }
    }
    WorkloadAttestor "systemd" {
        plugin_data {}
    }
}

health_checks {
    listener_enabled = true
    bind_address = "127.0.0.1"
    bind_port = "8082"
    live_path = "/live"
    ready_path = "/ready"
}
